<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 랩타임</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="top">
  <h1>F1 랩타임</h1>
  <nav id="seasons" class="tabs seasons" aria-label="시즌"></nav>
</header>

<nav id="meetings" class="tabs meetings" aria-label="경기"></nav>

<main id="main" hidden>
  <div class="session-bar">
    <h2 id="meeting-title"></h2>
    <p id="meeting-sub" class="muted"></p>
  </div>

  <div class="layout">
    <aside class="card drivers">
      <div class="drivers-head">
        <h3>선수</h3>
        <span>
          <button type="button" id="all-on">전체</button>
          <button type="button" id="all-off">해제</button>
        </span>
      </div>
      <div id="driver-list"></div>
    </aside>

    <div class="charts">
      <section class="card">
        <div class="card-head">
          <h3>세션별 순위</h3>
          <span class="muted">큰 숫자가 순위, 아래는 기록 (레이스는 1위와의 차이)</span>
        </div>
        <div class="table-wrap"><table id="ranking" class="ranking"></table></div>
        <p id="ranking-empty" class="empty" hidden>선수를 한 명 이상 선택하세요.</p>
      </section>

      <div class="filter-row">
        <h3>세션 기록</h3>
        <nav id="sessions" class="pills" aria-label="세션"></nav>
      </div>
      <div class="filter-row">
        <span class="muted">그래프·평균에 쓸 랩</span>
        <div class="pills" id="lap-filter" role="group" aria-label="랩 필터">
          <button type="button" data-mode="clean">클린 랩</button>
          <button type="button" data-mode="all">전체 랩</button>
        </div>
        <span class="muted" id="filter-note"></span>
      </div>

      <section class="card">
        <div class="card-head">
          <h3>랩 진행 (섹터 단위)</h3>
          <span class="muted">아래로 갈수록 빠름 · 선 색은 팀, 선 모양은 선수</span>
        </div>
        <div id="chart-pace" class="chart"></div>
        <p class="muted note" id="pace-note"></p>
      </section>

      <section class="card">
        <div class="card-head">
          <h3>섹터별 비교</h3>
          <div class="pills" id="sector-mode" role="group" aria-label="섹터 기록 기준">
            <button type="button" data-sector="best">최고 기록</button>
            <button type="button" data-sector="avg">평균 기록</button>
          </div>
        </div>
        <div id="chart-sectors" class="chart"></div>
        <p class="muted note">y축은 각 섹터에서 가장 빠른 선수와의 차이(초)입니다. 0에 가까울수록 그 섹터에서 빠릅니다.</p>
      </section>

      <section class="card">
        <div class="card-head"><h3>표로 보기</h3></div>
        <div class="table-wrap"><table id="table"></table></div>
      </section>
    </div>
  </div>
</main>

<p id="status" class="status">불러오는 중…</p>

<footer class="muted">
  데이터: <a href="https://openf1.org" rel="noopener">OpenF1</a> · 세션이 끝나면 자동으로 추가됩니다
  <span id="updated"></span>
</footer>

<div id="tooltip" class="tooltip" hidden></div>
<script type="module" src="assets/app.js"></script>
</body>
</html>
